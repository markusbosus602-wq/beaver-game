<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body { background: #2c3e50; color: white; text-align: center; font-family: sans-serif; margin: 0; overflow: hidden; height: 100vh; }
        
        .stats-top { margin-top: 20px; }
        .stats { font-size: 38px; font-weight: bold; color: #f1c40f; }
        .level-info { font-size: 16px; color: #ecf0f1; }
        
        #game { width: 250px; height: 250px; margin: 15px auto; position: relative; }
        #beaver { width: 100%; cursor: pointer; transition: 0.1s; position: relative; z-index: 1; }
        .acc-layer { position: absolute; pointer-events: none; z-index: 2; display: none; }
        #acc-hat { width: 45%; top: 6%; left: 27%; }
        #acc-glass { width: 40%; top: 32%; left: 30%; }

        #beaver:active { transform: scale(0.95); }
        #beaver:active ~ .acc-layer { transform: scale(0.95); }

        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #34495e; display: flex; justify-content: center; gap: 8px; padding: 15px 0; border-top: 4px solid #e67e22; z-index: 50; }
        .btn { padding: 10px 15px; background: #e67e22; border: none; color: white; border-radius: 10px; cursor: pointer; font-weight: bold; box-shadow: 0 4px #d35400; }

        .modal { display: none; background: rgba(20, 20, 20, 0.98); position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 200; padding-top: 40px; }
        .close-corner { position: absolute; top: 15px; right: 15px; font-size: 24px; background: #c0392b; color: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; }
        
        /* Стили для настроек звука */
        .setting-row { margin: 20px; text-align: left; padding: 0 30px; }
        .setting-row label { display: block; margin-bottom: 10px; font-weight: bold; }
        input[type=range] { width: 100%; cursor: pointer; accent-color: #e67e22; }

        .item { background: #34495e; margin: 10px; padding: 12px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #7f8c8d; }
        .item img { width: 50px; height: 50px; }
        #list { overflow-y: auto; height: 80vh; }
    </style>
</head>
<body>
    <div class="stats-top">
        <div class="stats">💰 <span id="balance">0</span></div>
        <div class="level-info">Уровень <span id="lvl">1</span> (<span id="clicks">0</span> кликов)</div>
    </div>
    
    <div id="game">
        <img id="beaver" src="https://img.icons8.com/color/480/beaver.png">
        <img id="acc-hat" class="acc-layer" src="">
        <img id="acc-glass" class="acc-layer" src="">
    </div>

    <div class="bottom-nav">
        <button class="btn" onclick="openP('shop')">ШОП</button>
        <button class="btn" style="background:#9b59b6" onclick="openP('wheel-p')">УДАЧА</button>
        <button class="btn" style="background:#7f8c8d" onclick="openP('settings')">⚙️</button>
    </div>

    <div id="shop" class="modal">
        <button class="close-corner" onclick="closeP('shop')">×</button>
        <h3>МАГАЗИН</h3>
        <div id="list"></div>
    </div>
    
    <div id="settings" class="modal">
        <button class="close-corner" onclick="closeP('settings')">×</button>
        <h3>НАСТРОЙКИ ЗВУКА</h3>
        <div class="setting-row">
            <label>Громкость музыки</label>
            <input type="range" id="vol-m" min="0" max="1" step="0.1" value="0.5" oninput="setVol()">
        </div>
        <div class="setting-row">
            <label>Громкость клика</label>
            <input type="range" id="vol-s" min="0" max="1" step="0.1" value="0.8" oninput="setVol()">
        </div>
        <button class="btn" onclick="closeP('settings')">ГОТОВО</button>
    </div>

    <div id="wheel-p" class="modal">
        <button class="close-corner" onclick="closeP('wheel-p')">×</button>
        <h3>КОЛЕСО</h3>
        <button class="btn" onclick="spin()">КРУТИТЬ (50)</button>
    </div>

    <audio id="snd-c" src="https://www.myinstants.com/media/sounds/crunch.mp3"></audio>
    <audio id="snd-m" src="https://www.bensound.com/bensound-music/bensound-buddy.mp3" loop></audio>

    <script>
        let b = parseInt(localStorage.getItem('b')) || 0, p = parseInt(localStorage.getItem('p')) || 1, tc = parseInt(localStorage.getItem('tc')) || 0,
            h_img = localStorage.getItem('hi')||"", g_img = localStorage.getItem('gi')||"";

        const assets = [
            {n:"Кепка", i:"baseball-cap", t:"hat"}, {n:"Очки", i:"glasses", t:"glass"}, {n:"Усы", i:"mustache", t:"glass"},
            {n:"Бандана", i:"bandana", t:"hat"}, {n:"Цилиндр", i:"top-hat", t:"hat"}, {n:"Нимб", i:"angel-halo", t:"hat"},
            {n:"Пират", i:"pirate-hat", t:"hat"}, {n:"Шлем", i:"knight-helmet", t:"hat"}, {n:"Корона", i:"crown", t:"hat"},
            {n:"Монокль", i:"monocle", t:"glass"}, {n:"Маска", i:"protection-mask", t:"glass"}, {n:"Колпак", i:"party-hat", t:"hat"}
        ]; // Добавь остальные до 30 по аналогии

        function up() {
            document.getElementById('balance').innerText = b.toLocaleString();
            document.getElementById('clicks').innerText = tc;
            document.getElementById('lvl').innerText = Math.floor(tc / 100) + 1;
            if(h_img){ let e=document.getElementById('acc-hat'); e.src=h_img; e.style.display='block'; }
            if(g_img){ let e=document.getElementById('acc-glass'); e.src=g_img; e.style.display='block'; }
            localStorage.setItem('b', b); localStorage.setItem('p', p); localStorage.setItem('tc', tc);
            localStorage.setItem('hi', h_img); localStorage.setItem('gi', g_img);
        }

        function setVol() {
            document.getElementById('snd-m').volume = document.getElementById('vol-m').value;
            document.getElementById('snd-c').volume = document.getElementById('vol-s').value;
        }

        document.getElementById('beaver').onclick = () => {
            b += p; tc++; 
            let s=document.getElementById('snd-c'); s.currentTime=0; s.play();
            let m=document.getElementById('snd-m'); if(m.paused) m.play();
            up();
        };

        function openP(id) {
            document.getElementById(id).style.display='block';
            if(id==='shop') {
                let l = document.getElementById('list'); l.innerHTML='';
                assets.forEach((it, i) => { 
                    let pr = (i + 1) * 40, pw = (i + 1) * 3, img = `https://img.icons8.com/color/100/${it.i}.png`;
                    l.innerHTML += `<div class="item"><img src="${img}"><b>${it.n}</b><button class="btn" onclick="buy('${img}','${it.t}',${pr},${pw})">${pr}</button></div>`;
                });
            }
        }
        function closeP(id){ document.getElementById(id).style.display='none'; }
        
        function buy(img, type, price, power) {
            if(b >= price) { b -= price; p += power; if(type === "hat") h_img = img; else g_img = img; up(); }
        }
        up(); setVol();
    </script>
</body>
</html>
