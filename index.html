<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Beaver Game</title>
    <style>
        body { background: #2c3e50; color: white; text-align: center; font-family: sans-serif; margin: 0; overflow: hidden; height: 100vh; }
        #admin-top { position: fixed; top: 15px; right: 15px; z-index: 100; }
        .stats { font-size: 32px; margin-top: 50px; font-weight: bold; color: #f1c40f; }
        #game { position: relative; width: 220px; height: 220px; margin: 40px auto; }
        #beaver { width: 100%; cursor: pointer; transition: 0.1s; position: relative; z-index: 1; }
        #beaver:active { transform: scale(0.95); }
        
        /* Старое меню в один ряд снизу */
        .bottom-menu { position: fixed; bottom: 0; left: 0; width: 100%; background: #34495e; display: flex; justify-content: center; gap: 10px; padding: 15px 0; border-top: 3px solid #e67e22; }
        
        .btn { padding: 10px 15px; background: #e67e22; border: none; color: white; border-radius: 8px; cursor: pointer; font-weight: bold; box-shadow: 0 4px #d35400; }
        .btn:active { transform: translateY(2px); box-shadow: 0 2px #d35400; }
        .btn-adm { background: #c0392b; font-size: 12px; padding: 8px 12px; box-shadow: none; }

        #shop, #settings, #wheel-p, #admin-p { display: none; background: rgba(0,0,0,0.98); position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 200; padding-top: 20px; }
        .item { background: #2c3e50; margin: 8px auto; padding: 10px; width: 90%; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #7f8c8d; }
        
        #wheel-img { width: 220px; transition: transform 3s cubic-bezier(0.1, 0, 0.1, 1); margin: 20px auto; display: block; }
    </style>
</head>
<body>
    <div id="admin-top"><button class="btn btn-adm" onclick="openP('admin-p')">⚙️ АДМИН</button></div>
    <div class="stats">💰 <span id="balance">0</span></div>
    
    <div id="game">
        <img id="beaver" src="https://cdn-icons-png.flaticon.com/512/3069/3069172.png">
    </div>

    <div class="bottom-menu">
        <button class="btn" onclick="openP('shop')">МАГАЗИН</button>
        <button class="btn" style="background:#9b59b6; box-shadow: 0 4px #8e44ad;" onclick="openP('wheel-p')">КОЛЕСО</button>
        <button class="btn" style="background:#7f8c8d; box-shadow: 0 4px #34495e;" onclick="openP('settings')">⚙️</button>
    </div>

    <div id="shop"><h3>МАГАЗИН</h3><div id="list" style="max-height: 70vh; overflow-y: auto;"></div><button class="btn" onclick="closeP('shop')">ЗАКРЫТЬ</button></div>
    
    <div id="wheel-p">
        <h3>КОЛЕСО УДАЧИ</h3>
        <p>Цена: 1,000 💰</p>
        <img id="wheel-img" src="https://cdn-icons-png.flaticon.com/512/2316/2316650.png">
        <button class="btn" onclick="spin()" id="spin-btn">КРУТИТЬ</button><br><br>
        <button class="btn" style="background:#c0392b" onclick="closeP('wheel-p')">ЗАКРЫТЬ</button>
    </div>

    <div id="settings">
        <h3>НАСТРОЙКИ</h3>
        <button class="btn" onclick="toggleM()" id="m-btn">Музыка: ON</button><br><br>
        <button class="btn" onclick="toggleS()" id="s-btn">Звуки: ON</button><br><br>
        <button class="btn" onclick="closeP('settings')">ГОТОВО</button>
    </div>

    <div id="admin-p"><h3>АДМИНКА</h3><p>Команды работают в чате бота</p><button class="btn" onclick="closeP('admin-p')">ЗАКРЫТЬ</button></div>

    <audio id="snd-click" src="https://www.myinstants.com/media/sounds/crunch.mp3"></audio>
    <audio id="bg-mus" src="https://www.bensound.com/bensound-music/bensound-buddy.mp3" loop></audio>

    <script>
        let b = parseInt(localStorage.getItem('b')) || 0, p = parseInt(localStorage.getItem('p')) || 1,
            mus = localStorage.getItem('m') !== '0', snd = localStorage.getItem('s') !== '0', isSpinning = false;

        const items = [];
        for(let i=1; i<=30; i++) items.push({n: "Вещь "+i, p: i*i*300, pw: i*10});

        function up() {
            document.getElementById('balance').innerText = b.toLocaleString();
            localStorage.setItem('b', b); localStorage.setItem('p', p);
            document.getElementById('m-btn').innerText = "Музыка: " + (mus?"ON":"OFF");
            document.getElementById('s-btn').innerText = "Звуки: " + (snd?"ON":"OFF");
        }

        document.getElementById('beaver').onclick = () => {
            b += p; 
            if(snd){ const s=document.getElementById('snd-click'); s.currentTime=0; s.volume=0.2; s.play(); }
            if(mus){ const m=document.getElementById('bg-mus'); if(m.paused) m.play(); m.volume=0.1; }
            up();
        };

        function spin() {
            if(isSpinning || b < 1000) return;
            isSpinning = true; b -= 1000; up();
            const deg = 1800 + Math.random() * 360;
            document.getElementById('wheel-img').style.transform = `rotate(${deg}deg)`;
            setTimeout(() => {
                b += Math.floor(Math.random() * 5000);
                isSpinning = false;
                document.getElementById('wheel-img').style.transform = `rotate(0deg)`;
                up();
            }, 3000);
        }

        function openP(id) {
            document.getElementById(id).style.display='block';
            if(id==='shop'){
                const l = document.getElementById('list'); l.innerHTML='';
                items.forEach((it, i) => { l.innerHTML += `<div class="item"><span>${it.n} (+${it.pw})</span><button class="btn" onclick="buy(${i})">${it.p}</button></div>`; });
            }
        }
        function closeP(id){ document.getElementById(id).style.display='none'; }
        function buy(i) { if(b >= items[i].p) { b -= items[i].p; p += items[i].pw; up(); closeP('shop'); } }
        function toggleM(){ mus=!mus; const m=document.getElementById('bg-mus'); if(!mus) m.pause(); else m.play(); localStorage.setItem('m', mus?1:0); up(); }
        function toggleS(){ snd=!snd; localStorage.setItem('s', snd?1:0); up(); }
        up();
    </script>
</body>
</html>
