<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Beaver Clicker</title>
    <style>
        body { background: #2c3e50; color: white; text-align: center; font-family: sans-serif; margin: 0; overflow: hidden; }
        .stats { font-size: 32px; margin-top: 20px; font-weight: bold; }
        #game-area { position: relative; width: 250px; height: 250px; margin: 20px auto; }
        #beaver { width: 100%; cursor: pointer; transition: transform 0.05s; z-index: 1; position: relative; }
        #accessory { position: absolute; width: 60%; top: 5%; left: 20%; z-index: 2; pointer-events: none; display: none; }
        #beaver:active { transform: scale(0.9); }
        .menu-btns { margin-top: 20px; }
        .btn { padding: 15px 25px; background: #e67e22; border: none; color: white; border-radius: 10px; cursor: pointer; font-size: 18px; margin: 5px; }
        #shop { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 10; padding-top: 40px; }
        .item { background: #34495e; margin: 10px auto; padding: 15px; width: 80%; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>
    <div class="stats">💰 <span id="balance">0</span></div>
    
    <div id="game-area">
        <img id="beaver" src="https://img.icons8.com/color/344/beaver.png">
        <img id="accessory" src="">
    </div>

    <div class="menu-btns">
        <button class="btn" onclick="showShop(true)">МАГАЗИН</button>
    </div>

    <div id="shop">
        <h2>УЛУЧШЕНИЯ</h2>
        <div id="items-list"></div>
        <button class="btn" style="background:#c0392b" onclick="showShop(false)">ЗАКРЫТЬ</button>
    </div>

    <audio id="snd-click" src="https://www.myinstants.com/media/sounds/crunch.mp3"></audio>

    <script>
        let bal = parseInt(localStorage.getItem('b_bal')) || 0;
        let pwr = parseInt(localStorage.getItem('b_pwr')) || 1;
        let auto = parseInt(localStorage.getItem('b_auto')) || 0;
        let accImg = localStorage.getItem('b_acc') || "";

        const shopItems = [
            {n: "🎩 Шляпа", p: 10, b: 1, img: "https://img.icons8.com/color/200/top-hat.png"},
            {n: "🕶 Очки", p: 150, b: 5, img: "https://img.icons8.com/color/200/sunglasses.png"},
            {n: "🤖 Авто", p: 3000, a: 1}
        ];

        function update() {
            document.getElementById('balance').innerText = Math.floor(bal).toLocaleString();
            const acc = document.getElementById('accessory');
            if(accImg) { acc.src = accImg; acc.style.display = 'block'; }
            localStorage.setItem('b_bal', bal);
            localStorage.setItem('b_pwr', pwr);
            localStorage.setItem('b_auto', auto);
            localStorage.setItem('b_acc', accImg);
        }

        document.getElementById('beaver').onclick = () => {
            bal += pwr;
            const s = document.getElementById('snd-click');
            s.volume = 0.3; // Тихий звук
            s.currentTime = 0; s.play();
            update();
        };

        function showShop(v) {
            document.getElementById('shop').style.display = v ? 'block' : 'none';
            if(v) {
                const list = document.getElementById('items-list');
                list.innerHTML = '';
                shopItems.forEach((it, i) => {
                    list.innerHTML += `<div class="item"><span>${it.n}</span><button class="btn" onclick="buy(${i})">${it.p}</button></div>`;
                });
            }
        }

        function buy(i) {
            let it = shopItems[i];
            if(bal >= it.p) {
                bal -= it.p;
                if(it.a) auto += it.a;
                else { pwr += it.b; accImg = it.img; }
                update();
                showShop(true);
            } else alert("Мало монет!");
        }

        setInterval(() => { if(auto > 0) { bal += auto; update(); } }, 1000);
        update();
    </script>
</body>
</html>
