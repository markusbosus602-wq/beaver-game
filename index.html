<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Beaver Online</title>
    <style>
        body { background: #2c3e50; color: white; text-align: center; font-family: sans-serif; margin: 0; overflow: hidden; height: 100vh; }
        
        /* Админка в верхнем правом углу */
        #admin-top { position: fixed; top: 15px; right: 15px; z-index: 100; }
        
        .stats { font-size: 32px; margin-top: 50px; font-weight: bold; color: #f1c40f; }
        
        #game { position: relative; width: 220px; height: 220px; margin: 60px auto; }
        #beaver { width: 100%; cursor: pointer; transition: 0.1s; position: relative; z-index: 1; }
        #acc { position: absolute; width: 60%; top: 5%; left: 20%; z-index: 2; pointer-events: none; }
        #beaver:active { transform: scale(0.95); }

        /* Нижнее меню */
        .bottom-menu { position: fixed; bottom: 0; left: 0; width: 100%; background: #34495e; display: flex; justify-content: space-around; padding: 15px 0; border-top: 3px solid #e67e22; }
        
        .btn { padding: 10px 15px; background: #e67e22; border: none; color: white; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-adm { background: #c0392b; font-size: 12px; padding: 8px 12px; }

        #shop, #settings, #wheel-p, #admin-p { display: none; background: rgba(0,0,0,0.98); position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 200; padding-top: 20px; overflow-y: auto; }
        .item { background: #2c3e50; margin: 8px auto; padding: 12px; width: 90%; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #7f8c8d; }
    </style>
</head>
<body>

    <div id="admin-top">
        <button class="btn btn-adm" onclick="openP('admin-p')">⚙️ ADM</button>
    </div>

    <div class="stats">💰 <span id="balance">0</span></div>

    <div id="game">
        <img id="beaver" src="https://cdn-icons-png.flaticon.com/512/3069/3069172.png">
        <img id="acc" src="" style="display:none;">
    </div>

    <div class="bottom-menu">
        <button class="btn" onclick="openP('shop')">МАГАЗИН</button>
        <button class="btn" style="background:#9b59b6" onclick="openP('wheel-p')">КОЛЕСО</button>
        <button class="btn" style="background:#7f8c8d" onclick="openP('settings')">НАСТРОЙКИ</button>
    </div>

    <div id="shop"><h3>МАГАЗИН (30)</h3><div id="list"></div><button class="btn" onclick="closeP('shop')">ЗАКРЫТЬ</button></div>
    <div id="wheel-p"><h3>КОЛЕСО</h3><img id="wheel-img" src="https://cdn-icons-png.flaticon.com/512/2316/2316650.png" style="width:200px; transition:3s;"><br><button class="btn" onclick="spin()">КРУТИТЬ (1000)</button><br><br><button class="btn" onclick="closeP('wheel-p')">ЗАКРЫТЬ</button></div>
    <div id="settings"><h3>НАСТРОЙКИ</h3><button class="btn" onclick="toggleL()" id="l-btn">Язык: RU</button><br><br><button class="btn" onclick="closeP('settings')">OK</button></div>
    
    <div id="admin-p">
        <h3>АДМИН-ПАНЕЛЬ</h3>
        <p>Команды вводить в чате бота:</p>
        <div style="text-align:left; padding:20px; font-size:14px;">
            /users — Список игроков<br>
            /give @user сумма — Выдать<br>
            /take @user сумма — Забрать<br>
            /setmod @user — Модератор
        </div>
        <button class="btn" onclick="closeP('admin-p')">ЗАКРЫТЬ</button>
    </div>

    <script>
        let b = parseInt(localStorage.getItem('b')) || 0, p = parseInt(localStorage.getItem('p')) || 1, 
            lng = localStorage.getItem('l') || 'RU', img = localStorage.getItem('i') || "";

        const items = [];
        for(let i=1; i<=30; i++) items.push({n:{RU:"Вещь "+i, EN:"Item "+i}, p:i*i*250, pw:i*15, i:"https://cdn-icons-png.flaticon.com/512/1865/1865328.png"});

        function up() {
            document.getElementById('balance').innerText = b.toLocaleString();
            const a = document.getElementById('acc');
            if(img){ a.src=img; a.style.display='block'; }
            localStorage.setItem('b',b); localStorage.setItem('p',p); localStorage.setItem('i',img); localStorage.setItem('l',lng);
        }

        document.getElementById('beaver').onclick = () => { b += p; up(); };

        function openP(id) {
            document.getElementById(id).style.display='block';
            if(id==='shop'){
                const l = document.getElementById('list'); l.innerHTML='';
                items.forEach((it, i) => { l.innerHTML += `<div class="item"><span>${it.n[lng]} (+${it.pw})</span><button class="btn" onclick="buy(${i})">${it.p}</button></div>`; });
            }
        }
        function closeP(id){ document.getElementById(id).style.display='none'; }
        function buy(i) { if(b >= items[i].p) { b -= items[i].p; p += items[i].pw; img = items[i].i; up(); closeP('shop'); } }
        function toggleL(){ lng = (lng==='RU'?'EN':'RU'); document.getElementById('l-btn').innerText="Язык: "+lng; up(); }
        up();
    </script>
</body>
</html>
