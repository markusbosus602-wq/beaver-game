<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Beaver Clicker</title>
    <style>
        body { background: #2c3e50; color: white; text-align: center; font-family: sans-serif; overflow: hidden; }
        #beaver { width: 200px; cursor: pointer; transition: transform 0.1s; margin-top: 50px; }
        #beaver:active { transform: scale(0.9); }
        .stats { font-size: 24px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="stats">Монеты: <span id="balance">0</span></div>
    <img id="beaver" src="https://img.icons8.com/color/344/beaver.png" alt="Beaver">
    <script>
        let balance = parseInt(localStorage.getItem('clicks')) || 0;
        const balanceEl = document.getElementById('balance');
        balanceEl.innerText = balance;

        document.getElementById('beaver').onclick = () => {
            balance += 1; // Базовая логика, улучшения считаются в боте
            balanceEl.innerText = balance;
            localStorage.setItem('clicks', balance);
        };
    </script>
</body>
</html>
