<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Beaver Clicker Premium</title>
    <style>
        body { 
            background: radial-gradient(circle, #34495e, #2c3e50); 
            color: white; font-family: 'Arial', sans-serif; text-align: center; margin: 0; overflow: hidden;
        }
        .stats { font-size: 28px; margin-top: 20px; text-shadow: 2px 2px 4px #000; }
        #beaver { width: 220px; cursor: pointer; transition: transform 0.05s; margin-top: 40px; }
        #beaver:active { transform: scale(0.9); }
        .menu { display: flex; justify-content: center; gap: 10px; margin-top: 20px; }
        .btn { padding: 10px 15px; background: #e67e22; border: none; color: white; border-radius: 5px; cursor: pointer; font-weight: bold; }
        #shop { display: none; background: rgba(0,0,0,0.8); position: fixed; top: 0; left: 0; width: 100%; height: 100%; pt: 50px; }
    </style>
</head>
<body>
    <div class="stats">Монеты: <span id="balance">0</span></div>
    <div style="font-size: 14px; color: #bdc3c7;">Сила клика: <span id="power">1</span> | Авто: <span id="auto">0</span></div>
    
    <img id="beaver" src="https://img.icons8.com/color/344/beaver.png">

    <div class="menu">
        <button class="btn" onclick="document.getElementById('shop').style.display='block'">МАГАЗИН</button>
    </div>

    <div id="shop">
        <h2>УЛУЧШЕНИЯ</h2>
        <button class="btn" onclick="buy(10, 1)">ШЛЯПА (+1) - 10💰</button><br><br>
        <button class="btn" onclick="buyAuto(3000, 1)">АВТОКЛИКЕР (+1/с) - 3000💰</button><br><br>
        <button class="btn" style="background: #c0392b;" onclick="document.getElementById('shop').style.display='none'">ЗАКРЫТЬ</button>
    </div>

    <audio id="click-sound" src="https://www.myinstants.com/media/sounds/crunch.mp3"></audio>
    <audio id="bg-music" src="https://www.bensound.com/bensound-music/bensound-buddy.mp3" loop></audio>

    <script>
        let balance = parseInt(localStorage.getItem('b_bal')) || 0;
        let power = parseInt(localStorage.getItem('b_pow')) || 1;
        let auto = parseInt(localStorage.getItem('b_auto')) || 0;

        const balEl = document.getElementById('balance');
        const powEl = document.getElementById('power');
        const autoEl = document.getElementById('auto');
        const snd = document.getElementById('click-sound');
        const music = document.getElementById('bg-music');

        function update() {
            balEl.innerText = balance;
            powEl.innerText = power;
            autoEl.innerText = auto;
            localStorage.setItem('b_bal', balance);
            localStorage.setItem('b_pow', power);
            localStorage.setItem('b_auto', auto);
        }

        document.getElementById('beaver').onclick = () => {
            balance += power;
            snd.currentTime = 0;
            snd.play();
            music.play(); // Музыка включится после первого клика
            update();
        };

        function buy(price, boost) {
            if (balance >= price) {
                balance -= price; power += boost; update();
            } else { alert("Недостаточно монет!"); }
        }

        function buyAuto(price, boost) {
            if (balance >= price) {
                balance -= price; auto += boost; update();
            } else { alert("Недостаточно монет!"); }
        }

        // Логика автокликера
        setInterval(() => {
            if (auto > 0) {
                balance += auto;
                update();
            }
        }, 1000);

        update();
    </script>
</body>
</html>
