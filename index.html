<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body { background: #1a252f; color: white; text-align: center; font-family: sans-serif; margin: 0; overflow: hidden; height: 100vh; }
        .header { padding: 10px; background: #2c3e50; border-bottom: 3px solid #e67e22; }
        .stats { font-size: 32px; font-weight: bold; color: #f1c40f; }
        .lvl-info { font-size: 14px; color: #bdc3c7; }
        #game { width: 260px; height: 260px; margin: 20px auto; position: relative; }
        #beaver { width: 100%; cursor: pointer; transition: 0.1s; position: relative; z-index: 1; }
        .acc { position: absolute; pointer-events: none; display: none; z-index: 5; transition: 0.1s; }
        #acc-h { width: 50%; top: -5%; left: 25%; } /* Шапки */
        #acc-f { width: 45%; top: 32%; left: 28%; } /* Лицо (усы/очки) */
        #beaver:active { transform: scale(0.95); }
        #beaver:active ~ .acc { transform: scale(0.95); }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: #2c3e50; display: flex; justify-content: space-around; padding: 15px 0; border-top: 4px solid #e67e22; }
        .btn { padding: 10px 20px; background: #e67e22; border: none; color: white; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .modal { display: none; background: #1a252f; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; overflow-y: auto; }
        .item { background: #34495e; margin: 10px; padding: 15px; border-radius: 12px; display: flex; align-items: center; justify-content: space-between; }
        .item img { width: 50px; height: 50px; border-radius: 5px; }
        .close { position: fixed; top: 10px; right: 10px; background: #c0392b; color: white; border: none; border-radius: 50%; width: 40px; height: 40px; z-index: 101; }
    </style>
</head>
<body>
    <div class="header">
        <div class="stats">💰 <span id="bal">0</span></div>
        <div class="lvl-info">Уровень: <span id="lvl">1</span> | Клик: +<span id="pwr">1</span></div>
    </div>

    <div id="game">
        <img id="beaver" src="https://img.icons8.com/color/480/beaver.png">
        <img id="acc-h" class="acc">
        <img id="acc-f" class="acc">
    </div>

    <div class="bottom-nav">
        <button class="btn" onclick="openM('shop')">МАГАЗИН</button>
        <button class="btn" onclick="reset()">СБРОС</button>
    </div>

    <div id="shop" class="modal">
        <button class="close" onclick="closeM('shop')">×</button>
        <div id="list" style="padding-top: 50px;"></div>
    </div>

    <audio id="snd" src="https://www.myinstants.com/media/sounds/crunch.mp3"></audio>

    <script>
        let b = parseInt(localStorage.getItem('b')) || 0;
        let p = parseInt(localStorage.getItem('p')) || 1;
        let h = localStorage.getItem('h') || "";
        let f = localStorage.getItem('f') || "";

        const assets = [
            {n:"Кепка", i:"baseball-cap", t:"h"}, {n:"Очки", i:"glasses", t:"f"},
            {n:"Усы", i:"mustache", t:"f"}, {n:"Шлем", i:"knight-helmet", t:"h"},
            {n:"Корона", i:"crown", t:"h"}, {n:"Маска", i:"protection-mask", t:"f"}
        ];

        function up() {
            document.getElementById('bal').innerText = b.toLocaleString();
            document.getElementById('pwr').innerText = p;
            
            // Расчет уровня
            let level = 1;
            if (b >= 100000000) level = 4;
            else if (b >= 10000000) level = 3;
            else if (b >= 1000000) level = 2;
            document.getElementById('lvl').innerText = level;

            const elH = document.getElementById('acc-h');
            if(h) { elH.src = h; elH.style.display = 'block'; }
            const elF = document.getElementById('acc-f');
            if(f) { elF.src = f; elF.style.display = 'block'; }

            localStorage.setItem('b', b); localStorage.setItem('p', p);
            localStorage.setItem('h', h); localStorage.setItem('f', f);
        }

        document.getElementById('beaver').onclick = () => {
            b += p; up();
            let s = document.getElementById('snd'); s.currentTime = 0; s.play();
        };

        function openM(id) {
            document.getElementById(id).style.display = 'block';
            let l = document.getElementById('list'); l.innerHTML = '';
            for(let i=1; i<=1000; i++) {
                let pr = i * 1000;
                if (pr > 100000000) break;
                let a = assets[i % assets.length];
                let img = `https://img.icons8.com/color/150/${a.i}.png`;
                l.innerHTML += `
                <div class="item">
                    <img src="${img}">
                    <div style="flex:1; margin-left:10px; text-align:left">
                        <b>${a.n} v.${i}</b><br><small>+${i*2} к клику</small>
                    </div>
                    <button class="btn" onclick="buy('${img}','${a.t}',${pr},${i*2})">${(pr >= 1000000 ? pr/1000000+'М' : pr/1000+'К')}</button>
                </div>`;
            }
        }

        function closeM(id) { document.getElementById(id).style.display = 'none'; }
        
        function buy(url, type, price, power) {
            if(b >= price) {
                b -= price; p += power;
                if(type === 'h') h = url; else f = url;
                up();
            } else alert("Нужно больше монет!");
        }

        function reset() { if(confirm("Сбросить игру?")) { localStorage.clear(); location.reload(); } }
        up();
    </script>
</body>
</html>
