<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body { background: #2c3e50; color: white; text-align: center; font-family: sans-serif; margin: 0; overflow: hidden; height: 100vh; }
        #adm-btn { position: fixed; top: 10px; right: 10px; z-index: 100; display: none; }
        
        /* Статистика и Уровень */
        .stats-top { margin-top: 30px; }
        .stats { font-size: 38px; font-weight: bold; color: #f1c40f; }
        .level-info { font-size: 18px; color: #ecf0f1; margin-top: 5px; }
        
        /* Бобер и предметы */
        #game { width: 230px; height: 230px; margin: 20px auto; position: relative; }
        #beaver { width: 100%; cursor: pointer; transition: 0.1s; position: relative; z-index: 1; }
        .acc-layer { position: absolute; pointer-events: none; z-index: 2; display: none; }
        #acc-hat { width: 50%; top: 5%; left: 25%; }
        #acc-glass { width: 45%; top: 30%; left: 27.5%; }

        #beaver:active { transform: scale(0.95); }
        #beaver:active ~ .acc-layer { transform: scale(0.95); }

        /* Навигация */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #34495e; display: flex; justify-content: center; gap: 8px; padding: 15px 0; border-top: 4px solid #e67e22; z-index: 50; }
        .btn { padding: 10px 15px; background: #e67e22; border: none; color: white; border-radius: 10px; cursor: pointer; font-weight: bold; box-shadow: 0 4px #d35400; font-size: 13px; }

        /* Окна */
        #shop, #settings, #wheel-p, #admin-p { display: none; background: rgba(0,0,0,0.98); position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 200; padding-top: 20px; overflow-y: auto; }
        .item { background: #34495e; margin: 8px; padding: 10px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #7f8c8d; }
        .item img { width: 45px; height: 45px; background: #2c3e50; border-radius: 8px; }
        
        .wheel-container { position: relative; width: 240px; height: 240px; margin: 20px auto; }
        #wheel-img { width: 100%; transition: 4s cubic-bezier(0.15, 0, 0.15, 1); }
    </style>
</head>
<body>
    <div id="adm-btn"><button class="btn" style="background:#c0392b;" onclick="openP('admin-p')">⚙️</button></div>
    
    <div class="stats-top">
        <div class="stats">💰 <span id="balance">0</span></div>
        <div class="level-info">Уровень: <span id="lvl">1</span> (<span id="clicks">0</span> кликов)</div>
    </div>
    
    <div id="game">
        <img id="beaver" src="https://img.icons8.com/color/480/beaver.png">
        <img id="acc-hat" class="acc-layer" src="">
        <img id="acc-glass" class="acc-layer" src="">
    </div>

    <div class="bottom-nav">
        <button class="btn" onclick="openP('shop')">МАГАЗИН</button>
        <button class="btn" style="background:#9b59b6" onclick="openP('wheel-p')">КОЛЕСО</button>
        <button class="btn" style="background:#7f8c8d" onclick="openP('settings')">⚙️</button>
    </div>

    <div id="shop"><h3>МАГАЗИН (30 вещей)</h3><div id="list" style="padding-bottom:100px;"></div><button class="btn" onclick="closeP('shop')">ЗАКРЫТЬ</button></div>
    
    <div id="wheel-p">
        <h3>УДАЧА</h3>
        <div class="wheel-container">
            <img id="wheel-img" src="https://cdn-icons-png.flaticon.com/512/2316/2316650.png">
        </div>
        <button class="btn" onclick="spin()">КРУТИТЬ (50)</button><br><br>
        <button class="btn" onclick="closeP('wheel-p')">ЗАКРЫТЬ</button>
    </div>

    <div id="settings"><h3>⚙️ НАСТРОЙКИ</h3><button class="btn" onclick="toggleM()" id="m-btn">Музыка: ON</button><br><br><button class="btn" onclick="toggleS()" id="s-btn">Звуки: ON</button><br><br><button class="btn" onclick="closeP('settings')">ОК</button></div>
    <div id="admin-p"><h3>АДМИН</h3><p>Команды: /give, /users</p><button class="btn" onclick="closeP('admin-p')">ЗАКРЫТЬ</button></div>

    <audio id="snd-c" src="https://www.myinstants.com/media/sounds/crunch.mp3"></audio>
    <audio id="snd-m" src="https://www.bensound.com/bensound-music/bensound-buddy.mp3" loop></audio>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp; tg.expand();
        if(tg.initDataUnsafe.user?.id === 5693452271) document.getElementById('adm-btn').style.display = 'block';

        let b = parseInt(localStorage.getItem('b')) || 0, 
            p = parseInt(localStorage.getItem('p')) || 1,
            tc = parseInt(localStorage.getItem('tc')) || 0,
            mus = true, snd = true, h_img = localStorage.getItem('hi')||"", g_img = localStorage.getItem('gi')||"", isS = false;

        // Генерация 30 предметов
        const icons = ["baseball-cap", "glasses", "mustache", "bandana", "top-hat", "angel-halo", "pirate-hat", "knight-helmet", "crown", "monocle"];
        const items = [];
        for(let i=1; i<=30; i++) {
            let type = i % 2 === 0 ? "glass" : "hat";
            let icon = icons[(i-1) % icons.length];
            items.push({ n: "Вещь #" + i, p: i * 50, pw: i * 3, t: type, i: `https://img.icons8.com/color/200/${icon}.png` });
        }

        function up() {
            document.getElementById('balance').innerText = b.toLocaleString();
            document.getElementById('clicks').innerText = tc;
            document.getElementById('lvl').innerText = Math.floor(tc / 100) + 1;
            if(h_img){ const e=document.getElementById('acc-hat'); e.src=h_img; e.style.display='block'; }
            if(g_img){ const e=document.getElementById('acc-glass'); e.src=g_img; e.style.display='block'; }
            localStorage.setItem('b', b); localStorage.setItem('p', p); localStorage.setItem('tc', tc);
            localStorage.setItem('hi', h_img); localStorage.setItem('gi', g_img);
        }

        document.getElementById('beaver').onclick = () => {
            b += p; tc++; 
            if(snd){ let s=document.getElementById('snd-c'); s.currentTime=0; s.play(); }
            if(mus){ let m=document.getElementById('snd-m'); if(m.paused) m.play(); } up();
        };

        function spin() {
            if(isS || b < 50) return; isS = true; b -= 50; up();
            let w = document.getElementById('wheel-img');
            w.style.transform = `rotate(${1800 + Math.random() * 360}deg)`;
            setTimeout(() => { b += Math.floor(Math.random()*1500); isS = false; w.style.transition='none'; w.style.transform='rotate(0deg)'; setTimeout(()=>w.style.transition='4s',50); up(); }, 4100);
        }

        function openP(id) {
            document.getElementById(id).style.display='block';
            if(id==='shop') {
                let l = document.getElementById('list'); l.innerHTML='';
                items.forEach((it, i) => { l.innerHTML += `<div class="item"><img src="${it.i}"><b>${it.n}<br><small>+${it.pw}</small></b><button class="btn" onclick="buy(${i})">${it.p}</button></div>`; });
            }
        }
        function closeP(id){ document.getElementById(id).style.display='none'; }
        function buy(i) {
            if(b >= items[i].p) {
                b -= items[i].p; p += items[i].pw;
                if(items[i].t === "hat") h_img = items[i].i; else g_img = items[i].i;
                up();
            }
        }
        function toggleM() { mus = !mus; let m = document.getElementById('snd-m'); if(!mus) m.pause(); else m.play(); }
        function toggleS() { snd = !snd; }
        up();
    </script>
</body>
</html>
