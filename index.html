<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Beaver Clicker</title>
    <style>
        body { background: #2c3e50; color: white; text-align: center; font-family: 'Segoe UI', sans-serif; margin: 0; overflow: hidden; height: 100vh; }
        
        /* Верхняя панель */
        .stats-top { margin-top: 20px; }
        .stats { font-size: 42px; font-weight: bold; color: #f1c40f; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .level-info { font-size: 16px; color: #bdc3c7; margin-top: 5px; }

        /* Игровая зона и Бобер */
        #game { width: 260px; height: 260px; margin: 20px auto; position: relative; }
        #beaver { width: 100%; cursor: pointer; transition: 0.1s; position: relative; z-index: 1; }
        .acc-layer { position: absolute; pointer-events: none; z-index: 2; display: none; }
        
        /* Координаты вещей (чтобы не были просто наложены) */
        #acc-hat { width: 48%; top: 5%; left: 26%; }
        #acc-glass { width: 42%; top: 31%; left: 29%; }

        #beaver:active { transform: scale(0.92); }
        #beaver:active ~ .acc-layer { transform: scale(0.92); }

        /* Нижнее меню */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #34495e; display: flex; justify-content: center; gap: 10px; padding: 15px 0; border-top: 4px solid #e67e22; z-index: 100; }
        .btn { padding: 12px 20px; background: #e67e22; border: none; color: white; border-radius: 12px; cursor: pointer; font-weight: bold; box-shadow: 0 4px #d35400; transition: 0.2s; }
        .btn:active { transform: translateY(2px); box-shadow: 0 2px #d35400; }

        /* Модальные окна */
        .modal { display: none; background: rgba(15, 15, 15, 0.98); position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 200; padding-top: 50px; }
        .close-btn { position: absolute; top: 15px; right: 15px; background: #c0392b; color: white; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 22px; cursor: pointer; font-weight: bold; }
        
        /* Список магазина */
        #list { overflow-y: auto; height: 80vh; padding: 10px; }
        .item { background: #2c3e50; margin-bottom: 10px; padding: 12px; border-radius: 15px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #444; }
        .item img { width: 50px; height: 50px; border-radius: 8px; }
        .item-info { text-align: left; flex-grow: 1; margin-left: 15px; }

        /* Настройки звука */
        .setting-row { margin: 25px; text-align: left; padding: 0 20px; }
        input[type=range] { width: 100%; accent-color: #e67e22; height: 10px; cursor: pointer; }

        /* Колесо */
        .wheel-box { position: relative; width: 250px; height: 250px; margin: 30px auto; }
        #wheel-img { width: 100%; transition: 4s cubic-bezier(0.1, 0, 0.1, 1); }
        .arrow { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 35px; z-index: 10; }
    </style>
</head>
<body>

    <div class="stats-top">
        <div class="stats">💰 <span id="balance">0</span></div>
        <div class="level-info">LVL <span id="lvl">1</span> | КЛИКИ: <span id="tc">0</span></div>
    </div>
    
    <div id="game">
        <img id="beaver" src="https://img.icons8.com/color/480/beaver.png">
        <img id="acc-hat" class="acc-layer" src="">
        <img id="acc-glass" class="acc-layer" src="">
    </div>

    <div class="bottom-nav">
        <button class="btn" onclick="openP('shop')">ШОП</button>
        <button class="btn" style="background:#9b59b6" onclick="openP('wheel')">УДАЧА</button>
        <button class="btn" style="background:#7f8c8d" onclick="openP('settings')">⚙️</button>
    </div>
